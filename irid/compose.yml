services:
  irid:
    build:
      context: ..
      dockerfile: irid/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    restart: unless-stopped
    develop:
      watch:
        - path: ../irid
          action: sync+restart
          target: /app/irid
          ignore:
            - assets/css/app.css
    expose:
      - 3839
    environment:
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-postgres}
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATABASE: ${POSTGRES_DB:-irid_example}
    depends_on:
      - db
    deploy:
      replicas: ${IRID_REPLICAS:-1}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--max-time", "5", "http://127.0.0.1:3839/"]
      interval: ${HEALTHCHECK_INTERVAL:-15s}
      timeout: ${HEALTHCHECK_TIMEOUT:-5s}
      start_period: ${HEALTHCHECK_START_PERIOD:-30s}
      retries: ${HEALTHCHECK_RETRIES:-3}
