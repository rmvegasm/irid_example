services:
  db:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-irid_example}
    volumes:
      - ./pgdata:/var/lib/postgresql
      - ./pginit:/docker-entrypoint-initdb.d
    expose:
      - 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-irid_example}"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
